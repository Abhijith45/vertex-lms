name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gate:
    name: Web Quality Gate (Types, Lint, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Verification
        run: npm run type-check

      - name: ESLint Code Inspection
        run: npm run lint

      - name: Automated Unit & Integration Tests (235 tests)
        run: npm test

      - name: Next.js Turbopack Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_mock_clerk_secret_for_ci_build
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_SANITY_PROJECT_ID: lb09hkdy
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_READ_TOKEN: sk_ci_mock_read_token
          SANITY_API_WRITE_TOKEN: sk_ci_mock_write_token
          SANITY_CONTEXT_MCP_URL: https://api.sanity.io/v2026-03-03/context/mcp/mock/production/search-context
          OPENAI_API_KEY: sk-proj-ci-mock-openai-key
          STRIPE_SECRET_KEY: sk_test_mock_stripe_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_secret
          CERTIFICATE_SECRET_KEY: ci_mock_certificate_hmac_signing_secret_32_bytes_long
          CERTIFICATE_SIGNING_SECRET: ci_mock_certificate_hmac_signing_secret_32_bytes_long
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_mock_token
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_SITE_URL: https://vertex.example.com

  studio-quality-gate:
    name: Studio Quality Gate (Sanity Studio v5 Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio Dependencies
        run: npm ci

      - name: Sanity Studio Build Verification
        run: npm run build
        env:
          SANITY_STUDIO_PROJECT_ID: lb09hkdy
          SANITY_STUDIO_DATASET: production

  deploy-production:
    name: Production Deployment (Vercel)
    runs-on: ubuntu-latest
    needs: [web-quality-gate, studio-quality-gate]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Vercel Token Configuration
        id: check-token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Info Notice (Native Vercel Git Integration)
        if: steps.check-token.outputs.has_token == 'false'
        run: |
          echo "::notice ::All automated tests and quality gates passed! VERCEL_TOKEN is not configured in GitHub Secrets, so Vercel's native GitHub App integration automatically deploys the verified commit on main. To enable direct CLI deployment through GitHub Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to your repository secrets."

      - name: Deploy to Vercel (Action CLI)
        if: steps.check-token.outputs.has_token == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: web
